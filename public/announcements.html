<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1621">
  <title>NexClub | Community</title>
  <style>
    :root{color-scheme:dark;--bg:#0e1621;--panel:#17212b;--panel2:#202c38;--line:#263442;--text:#e8edf2;--muted:#8d9aa8;--blue:#64b5ef;--green:#54c78b;--bubble:#182533;--shadow:0 18px 60px #050b12a6}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#1a3041 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
    .app{width:min(100%,1050px);min-height:100vh;margin:auto;display:flex;flex-direction:column;background:#101a25;border-inline:1px solid #1a2733;box-shadow:var(--shadow)}
    .topbar{height:78px;padding:0 25px;display:flex;align-items:center;gap:14px;background:var(--panel);border-bottom:1px solid var(--line)}.avatar{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#65b7ed,#377eae);color:#092137;font-weight:850;font-size:19px;letter-spacing:-1px;flex:none}.brand{min-width:0;flex:1}.brand h1{font-size:16px;margin:0;font-weight:720;letter-spacing:.01em}.sub{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin-top:3px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 9px #54c78b66}.online{white-space:nowrap}.home{color:var(--blue);text-decoration:none;font-size:13px;padding:9px 12px;border:1px solid #334556;border-radius:9px}.home:hover{background:#223140}
    .pinned{display:flex;gap:12px;align-items:flex-start;padding:14px 22px;background:#172837;border-bottom:1px solid #28445a}.pin-icon{color:var(--blue);font-size:16px;line-height:1.5}.pin-copy{min-width:0;flex:1}.pin-label{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.pin-text{font-size:13px;overflow-wrap:anywhere;margin-top:2px}.pin-empty{color:var(--muted);font-size:13px}
    .tabs{display:flex;gap:4px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}.tab{position:relative;border:0;background:transparent;color:var(--muted);padding:15px 13px 13px;font-size:13px;font-weight:650}.tab[aria-selected=true]{color:var(--blue)}.tab[aria-selected=true]:after{position:absolute;content:"";height:2px;border-radius:2px 2px 0 0;bottom:-1px;left:10px;right:10px;background:var(--blue)}
    .feed{flex:1;min-height:300px;max-height:calc(100vh - 315px);overflow:auto;padding:24px clamp(16px,5vw,58px);scroll-behavior:smooth;background-color:#101a25;background-image:radial-gradient(#1c2a37 0.7px,transparent .7px);background-size:17px 17px}.day-label{width:max-content;margin:0 auto 18px;padding:5px 10px;border-radius:8px;background:#23313f;color:#bec9d4;font-size:11px;box-shadow:0 2px 7px #0002}.post{max-width:720px;margin:0 auto 13px;padding:12px 15px;background:var(--bubble);border:1px solid #213242;border-radius:5px 14px 14px 14px;box-shadow:0 2px 4px #0002;overflow-wrap:anywhere}.post.pinned-post{border-left:2px solid var(--blue)}.post-head{display:flex;align-items:center;gap:7px;margin-bottom:5px}.author{color:var(--blue);font-size:12px;font-weight:750}.badge{color:#95a7b8;font-size:10px;padding:1px 6px;border:1px solid #334454;border-radius:10px}.message{white-space:pre-wrap;font-size:14px;line-height:1.55}.post-foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:7px;color:var(--muted);font-size:10px}.pin-mini{color:var(--blue);margin-right:auto}.remove{border:0;background:transparent;color:#8293a3;padding:1px 5px;font-size:11px}.remove:hover{color:#ff8c8c}.empty{max-width:400px;margin:45px auto;text-align:center;color:var(--muted);font-size:13px}.empty-icon{font-size:28px;margin-bottom:8px}.form-area{padding:14px 20px 18px;background:var(--panel);border-top:1px solid var(--line)}.composer{max-width:760px;margin:auto}.field{width:100%;border:1px solid #344352;border-radius:12px;background:#111b25;color:var(--text);outline:none;padding:12px 14px;resize:vertical;min-height:48px}.field:focus{border-color:#579dcc;box-shadow:0 0 0 3px #64b5ef19}.field::placeholder{color:#758494}.composer-row{display:flex;align-items:center;gap:12px;margin-top:9px}.composer-hint{font-size:11px;color:var(--muted);flex:1}.check{display:flex;align-items:center;gap:7px;font-size:12px;color:#bac5ce;white-space:nowrap}.check input{accent-color:var(--blue);width:15px;height:15px}.send{border:0;border-radius:9px;background:var(--blue);color:#092137;font-weight:750;font-size:13px;padding:10px 18px}.send:hover{background:#8acaf5}.send:focus-visible,.tab:focus-visible,.home:focus-visible{outline:2px solid white;outline-offset:2px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:10px 15px;border-radius:9px;background:#233848;color:#deebf3;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:800px){body{padding:20px}.app{min-height:calc(100vh - 40px);border-radius:16px;overflow:hidden}.feed{max-height:calc(100vh - 350px)}}@media(max-width:520px){.topbar{height:69px;padding:0 14px}.avatar{width:42px;height:42px}.online{display:none}.home{font-size:12px;padding:8px}.tabs{padding:0 8px}.tab{flex:1;padding:13px 6px;font-size:12px}.feed{max-height:none;min-height:300px;flex:1}.form-area{padding:12px 12px calc(14px + env(safe-area-inset-bottom))}.composer-row{gap:8px;flex-wrap:wrap}.composer-hint{width:100%;flex-basis:100%;order:2}.check{margin-right:auto}.send{padding:10px 15px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="avatar" aria-hidden="true">NC</div>
      <div class="brand"><h1>NexClub Community</h1><div class="sub"><span class="dot"></span><span class="online" id="onlineCount">24 members online</span><span>·</span><span>club updates &amp; feedback</span></div></div>
      <a class="home" href="/nexus-election-site.html" aria-label="Return to Nexus Coding Club elections">Club home</a>
    </header>
    <aside class="pinned" aria-live="polite"><span class="pin-icon" aria-hidden="true">📌</span><div class="pin-copy"><div class="pin-label">Pinned announcement</div><div class="pin-text" id="pinnedText"></div></div></aside>
    <nav class="tabs" role="tablist" aria-label="Community channels"><button class="tab" id="tab-announcements" role="tab" aria-selected="true" aria-controls="feed" data-tab="announcements">Official Announcements</button><button class="tab" id="tab-feedback" role="tab" aria-selected="false" aria-controls="feed" data-tab="feedback">Anonymous Feedback</button></nav>
    <section class="feed" id="feed" role="tabpanel" aria-labelledby="tab-announcements" tabindex="0"></section>
    <section class="form-area"><form class="composer" id="postForm"><label class="sr-only" for="postText" style="position:absolute;left:-9999px">Write a post</label><textarea class="field" id="postText" maxlength="2000" rows="2" placeholder="Write an announcement…" required></textarea><div class="composer-row"><span class="composer-hint" id="formHint">Announcements are stored in this browser.</span><label class="check" id="pinControl"><input id="pinToggle" type="checkbox"> Pin announcement</label><button class="send" type="submit" id="sendButton">Post announcement</button></div></form></section>
  </main><div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (()=>{
      const KEYS={announcements:"nexclub.announcements.v1",feedback:"nexclub.feedback.v1",pinned:"nexclub.pinnedAnnouncement.v1"};
      const feed=document.querySelector("#feed"),form=document.querySelector("#postForm"),input=document.querySelector("#postText"),pinToggle=document.querySelector("#pinToggle"),pinText=document.querySelector("#pinnedText"),pinControl=document.querySelector("#pinControl"),sendButton=document.querySelector("#sendButton"),hint=document.querySelector("#formHint"),tabs=[...document.querySelectorAll("[data-tab]")];
      let active="announcements";
      function read(key,fallback){try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}}
      function write(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{toast("Could not save: browser storage may be full or disabled.");return false}}
      function escapeText(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
      function toast(message){const el=document.querySelector("#toast");el.textContent=message;el.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),2600)}
      function renderPinned(){const p=read(KEYS.pinned,null);pinText.textContent=p?.text||"No pinned announcement right now. Check back for club news.";pinText.classList.toggle("pin-empty",!p?.text)}
      function formatDate(iso){const d=new Date(iso);return Number.isNaN(d.valueOf())?"":new Intl.DateTimeFormat(undefined,{dateStyle:"medium",timeStyle:"short"}).format(d)}
      function render(){const items=read(KEYS[active],[]);feed.setAttribute("aria-labelledby",`tab-${active}`);if(!Array.isArray(items)||items.length===0){feed.innerHTML=`<div class="day-label">Today</div><div class="empty"><div class="empty-icon">${active==="announcements"?"📣":"💬"}</div>${active==="announcements"?"No official announcements yet.":"No feedback yet. Your message will be anonymous."}</div>`;return}
        feed.innerHTML=`<div class="day-label">Community messages</div>`+items.map(item=>`<article class="post ${item.pinned?"pinned-post":""}"><div class="post-head"><span class="author">${active==="announcements"?"NexClub Admin":"Anonymous member"}</span>${active==="announcements"?'<span class="badge">OFFICIAL</span>':'<span class="badge">ANONYMOUS</span>'}</div><div class="message">${escapeText(item.text)}</div><div class="post-foot">${item.pinned?'<span class="pin-mini">📌 Pinned</span>':""}<time datetime="${escapeText(item.createdAt)}">${escapeText(formatDate(item.createdAt))}</time><button class="remove" type="button" data-delete="${escapeText(item.id)}" aria-label="Delete this post" title="Delete this post">Delete</button></div></article>`).join("");feed.scrollTop=feed.scrollHeight;
      }
      function setTab(tab){active=tab;tabs.forEach(b=>{const selected=b.dataset.tab===tab;b.setAttribute("aria-selected",String(selected));b.tabIndex=selected?0:-1});const isAnnouncements=tab==="announcements";input.placeholder=isAnnouncements?"Write an announcement…":"Share feedback anonymously…";sendButton.textContent=isAnnouncements?"Post announcement":"Send anonymously";hint.textContent=isAnnouncements?"Announcements are stored in this browser.":"Your feedback is saved without a name.";pinControl.hidden=!isAnnouncements;pinToggle.checked=false;render()}
      tabs.forEach((b,i)=>{b.addEventListener("click",()=>setTab(b.dataset.tab));b.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();const n=(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length;tabs[n].focus();tabs[n].click()}})});
      form.addEventListener("submit",e=>{e.preventDefault();const text=input.value.trim();if(!text)return;const item={id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,text,createdAt:new Date().toISOString(),pinned:active==="announcements"&&pinToggle.checked};const items=read(KEYS[active],[]);items.unshift(item);if(!write(KEYS[active],items))return;if(item.pinned){write(KEYS.pinned,{text:item.text,id:item.id});renderPinned()}input.value="";pinToggle.checked=false;render();feed.scrollTo({top:0,behavior:"smooth"});input.focus()});
      feed.addEventListener("click",e=>{const btn=e.target.closest("[data-delete]");if(!btn)return;const items=read(KEYS[active],[]).filter(item=>item.id!==btn.dataset.delete);if(!write(KEYS[active],items))return;const pinned=read(KEYS.pinned,null);if(pinned?.id===btn.dataset.delete){localStorage.removeItem(KEYS.pinned);renderPinned()}render()});
      renderPinned();render();
    })();
  </script>
</body>
</html>
