<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7f5" />
    <title>Sign in | Nexus Coding Club</title>
    <style>
      
      :root {
        color-scheme: light;
        --ink: #171a18;
        --muted: #66716a;
        --paper: #f5f7f5;
        --line: #e3e8e4;
        --green: #39865b;
        --pale: #eaf3ec;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      a { color: inherit; }
      .topbar {
        height: 74px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 max(5vw, 22px);
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 750; }
      .brand img { width: 82px; height: 44px; object-fit: contain; background: #080808; border-radius: 5px; }
      .brand small { display: block; margin-top: 3px; color: #849087; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; }
      .back { color: var(--muted); font-size: 13px; text-decoration: none; }
      .back:hover { color: var(--green); }
      .back + .back { margin-left: 18px; }
      main { display: grid; place-items: center; padding: 48px 20px; }
      .login-card {
        width: min(100%, 440px);
        padding: clamp(28px, 6vw, 44px);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 18px 55px rgb(22 43 29 / 7%);
      }
      .eyebrow { margin: 0 0 10px; color: var(--green); font-size: 11px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(28px, 6vw, 36px); letter-spacing: -.04em; }
      .intro { margin: 10px 0 28px; color: var(--muted); font-size: 14px; line-height: 1.6; }
      .field { margin-top: 18px; }
      label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 650; }
      input {
        width: 100%;
        min-height: 48px;
        padding: 0 14px;
        border: 1px solid #d6ded8;
        border-radius: 9px;
        outline: none;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
      }
      input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgb(57 134 91 / 14%); }
      .submit {
        width: 100%;
        min-height: 49px;
        margin-top: 24px;
        border: 0;
        border-radius: 9px;
        background: var(--green);
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: background .15s ease, transform .15s ease;
      }
      .submit:hover { background: #2e714b; }
      .submit:active { transform: translateY(1px); }
      .submit:disabled { opacity: .65; cursor: wait; }
      .status { min-height: 24px; margin: 14px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
      .status.error { color: #a53636; }
      .status.success { color: var(--green); }
      footer { padding: 18px 22px; color: #849087; font-size: 11px; text-align: center; }
      @media (max-width: 480px) {
        .brand img { width: 58px; height: 36px; }
        .topbar { height: 66px; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Nexus Coding Club home">
        <img src="/nexus-icon.jpg" alt="" />
        <span>Nexus Coding Club<small>Community elections</small></span>
      </a>
      <nav aria-label="Quick links"><a class="back" href="/announcements.html">View Announcements</a><a class="back" href="/">Back to elections</a></nav>
    </header>
    <main>
      <section class="login-card" aria-labelledby="login-title">
        <p class="eyebrow">Member account</p>
        <h1 id="login-title">Welcome back</h1>
        <p class="intro">Sign in to your approved Nexus account.</p>
        <form id="loginForm">
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button class="submit" id="submitButton" type="submit">Sign in</button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </form>
        <p class="signup-link" style="margin: 18px 0 0; color: var(--muted); font-size: 13px; text-align: center;">Need an account? <a href="/signup.html" style="color: var(--green); font-weight: 650;">Request access</a></p>
      </section>
    </main>
    <footer>© 2026 Nexus Coding Club · Elections</footer>
    <script>
      const form = document.querySelector("#loginForm");
      const button = document.querySelector("#submitButton");
      const status = document.querySelector("#status");
      const redirectMessage = new URLSearchParams(window.location.search).get("message");
      if (redirectMessage) status.textContent = redirectMessage;

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        button.textContent = "Signing in…";
        status.textContent = "";
        status.className = "status";

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            credentials: "same-origin",
            cache: "no-store",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: form.email.value.trim(),
              password: form.password.value,
            }),
          });
          const contentType = response.headers.get("content-type") || "";
          let data;
          if (contentType.includes("application/json")) {
            data = await response.json();
          } else {
            const message = (await response.text()).trim();
            data = { error: message || "The server returned an unexpected response." };
          }
          if (!response.ok) throw new Error(data.error || "Sign-in failed. Please try again.");
          status.textContent = "Signed in. Returning to elections…";
          status.classList.add("success");
          window.location.assign("/nexus-election-site.html");
        } catch (error) {
          status.textContent = error.message || "Could not reach the server. Please try again.";
          status.classList.add("error");
          button.disabled = false;
          button.textContent = "Sign in";
        }
      });
    </script>
  </body>
</html>
